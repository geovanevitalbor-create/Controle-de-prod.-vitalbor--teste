<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Apontamento — Vitalbor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================================
   Painel industrial escuro — inspirado em HMI/CLP de chão de
   fábrica: fundo quase-preto, cartões elevados, cores de
   sinalização tipo semáforo (verde=rodando, âmbar=atenção/
   refugo, vermelho=parado/erro). Não é "dark mode de app
   consumer", é painel de máquina de verdade.
   ============================================================ */
:root {
  --bg: #16171A;
  --surface: #1F2024;
  --surface-2: #292B31;
  --ink: #F4F5F7;
  --ink-muted: #9A9DA6;
  --linha: #34363C;
  --accent: #22C55E;
  --accent-forte: #16A34A;
  --accent-ink: #052E16;
  --accent-bg-fraca: rgba(34,197,94,0.16);
  --alerta: #F04438;
  --alerta-forte: #C6281C;
  --alerta-bg-fraca: rgba(240,68,56,0.18);
  --aviso: #F5A524;
  --aviso-forte: #B87508;
  --aviso-ink: #2B1600;
  --aviso-bg-fraca: rgba(245,165,36,0.18);
  --radius-lg: 22px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --sombra: 0 14px 36px rgba(0,0,0,0.5);
  --fonte-display: 'Barlow Semi Condensed', system-ui, sans-serif;
  --fonte-corpo: 'Inter', system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0; min-height: 100%;
  background: var(--bg); color: var(--ink);
  font-family: var(--fonte-corpo);
}

#app { min-height: 100vh; display: flex; flex-direction: column; }

.cabecalho {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 18px 24px; background: var(--surface); border-bottom: 1px solid var(--linha);
}
.marca { font-family: var(--fonte-display); font-weight: 800; font-size: 22px; letter-spacing: 0.01em; }
.marca-sub { font-weight: 500; color: var(--ink-muted); font-size: 15px; margin-left: 6px; }
.maquina-chip { font-family: var(--fonte-display); font-weight: 700; font-size: 16px; background: var(--surface-2); padding: 8px 18px; border-radius: 999px; border: 1px solid var(--linha); }
.relogio { font-variant-numeric: tabular-nums; color: var(--ink-muted); font-size: 14px; }

.conteudo { flex: 1; padding: 24px; display: flex; }
.tela-central { flex: 1; display: flex; align-items: center; justify-content: center; }

.cartao {
  background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--sombra);
  padding: 32px; width: 100%; max-width: 520px;
  max-height: calc(100vh - 48px); overflow-y: auto;
  border: 1px solid var(--linha);
}
.cartao-ocioso { text-align: center; }
.cartao-ocioso h1 { font-family: var(--fonte-display); font-weight: 800; font-size: 42px; margin: 12px 0 4px; }

.status-pill {
  display: inline-block; font-family: var(--fonte-display); font-weight: 700; font-size: 14px;
  padding: 7px 18px; border-radius: 999px; letter-spacing: 0.03em;
}
.status-ocioso { background: var(--surface-2); color: var(--ink-muted); }
.status-rodando { background: var(--accent-bg-fraca); color: var(--accent); }
.status-parado { background: var(--alerta-bg-fraca); color: var(--alerta); }

h2 { font-family: var(--fonte-display); font-weight: 700; font-size: 25px; margin: 0 0 20px; }
.muted { color: var(--ink-muted); }
.muted-pequeno { color: var(--ink-muted); font-size: 13px; margin: 6px 0 16px; }

label { display: block; font-size: 13px; font-weight: 700; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.04em; margin: 18px 0 7px; }
label:first-of-type { margin-top: 0; }

select, input[type="text"], input[type="number"], textarea {
  width: 100%; font-family: var(--fonte-corpo); font-size: 18px; padding: 15px 16px;
  border-radius: var(--radius-sm); border: 1.5px solid var(--linha);
  background: var(--surface-2); color: var(--ink); min-height: 58px;
}
select:focus-visible, input:focus-visible, textarea:focus-visible, button:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 1px;
}
select:disabled { color: var(--ink-muted); }
textarea { resize: vertical; min-height: 90px; }

button { transition: transform 0.08s ease, background 0.15s ease, filter 0.15s ease; }

.botao {
  font-family: var(--fonte-display); font-weight: 700; font-size: 18px; letter-spacing: 0.01em;
  border: none; border-radius: var(--radius-sm); padding: 16px 20px; cursor: pointer; min-height: 62px;
}
.botao:disabled { opacity: 0.5; cursor: not-allowed; }
.botao:active:not(:disabled) { transform: scale(0.96); }
.botao-primario { background: var(--accent); color: var(--accent-ink); }
.botao-primario:active:not(:disabled) { background: var(--accent-forte); }
.botao-secundario { background: var(--surface-2); color: var(--ink); border: 1.5px solid var(--linha); }
.botao-alerta { background: var(--alerta); color: #fff; }
.botao-alerta:active:not(:disabled) { background: var(--alerta-forte); }
.botao-grande { width: 100%; font-size: 20px; padding: 20px 22px; min-height: 70px; }

.linha-botoes { display: flex; gap: 12px; margin-top: 24px; }
.linha-botoes .botao { flex: 1; }

.alerta-banner { background: var(--alerta-bg-fraca); color: #FF8A80; border: 1px solid var(--alerta); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 14px; margin-bottom: 16px; }

.cartao-andamento { text-align: center; border-top: 6px solid var(--accent); }
.cartao-andamento.cartao-parado { border-top-color: var(--alerta); }

.cronometro { font-family: var(--fonte-display); font-variant-numeric: tabular-nums; font-weight: 800; font-size: 68px; letter-spacing: 0.02em; margin: 12px 0; }
.cartao-rodando .cronometro { color: var(--accent); }
.cartao-parado .cronometro { color: var(--alerta); }
.motivo-parada { color: var(--alerta); font-weight: 700; margin: -4px 0 12px; }

.grade-info { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; text-align: left; margin: 24px 0 4px; padding-top: 20px; border-top: 1px solid var(--linha); }
.rotulo-info { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-muted); margin-bottom: 3px; }

.cavidade-atual { text-align: left; font-size: 15px; color: var(--ink); margin: 16px 0; padding-top: 16px; border-top: 1px solid var(--linha); }
.link-editar { background: var(--surface-2); border: 1px solid var(--linha); color: var(--accent); font-family: var(--fonte-corpo); font-size: 13px; font-weight: 700; cursor: pointer; padding: 6px 12px; border-radius: 999px; min-height: auto; margin-left: 6px; }

.progresso-bloco { margin: 18px 0 4px; text-align: left; }
.progresso-legenda { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--ink-muted); margin-bottom: 7px; font-weight: 600; }
.barra-fundo { background: var(--surface-2); border-radius: 999px; height: 14px; overflow: hidden; border: 1px solid var(--linha); }
.barra-preenchida { background: linear-gradient(90deg, var(--accent-forte), var(--accent)); height: 100%; border-radius: 999px; transition: width 0.4s ease; }

.ficha-compacta { text-align: left; font-size: 14px; color: var(--ink-muted); line-height: 1.7; margin: 18px 0; padding-bottom: 16px; border-bottom: 1px solid var(--linha); }
.ficha-compacta strong { color: var(--ink); font-weight: 800; font-size: 16px; }

.desempenho-bloco { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; text-align: left; margin: 12px 0 4px; padding: 12px 14px; border-radius: var(--radius-sm); border: 1px solid var(--linha); }
.desempenho-ok { background: var(--accent-bg-fraca); border-color: var(--accent-forte); }
.desempenho-atras { background: var(--aviso-bg-fraca); border-color: var(--aviso-forte); }
.desempenho-selo { font-family: var(--fonte-display); font-weight: 800; font-size: 15px; }
.desempenho-ok .desempenho-selo { color: var(--accent); }
.desempenho-atras .desempenho-selo { color: var(--aviso); }
.desempenho-numeros { font-size: 13px; color: var(--ink-muted); }

.revisao-numero { font-family: var(--fonte-display); font-weight: 800; font-size: 58px; color: var(--accent); line-height: 1; margin: 12px 0; }
.revisao-numero span { font-size: 16px; font-weight: 600; color: var(--ink-muted); margin-left: 6px; }

.caixas-resumo { text-align: left; font-size: 13px; color: var(--ink-muted); margin: 12px 0; }

.refugo-rapido-bloco { text-align: left; margin: 20px 0 4px; }
.grade-refugo-rapido { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 8px; }
.botao-refugo-rapido {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--aviso-bg-fraca); border: 1.5px solid var(--aviso-forte);
  border-radius: var(--radius-sm); padding: 14px 16px; cursor: pointer;
  font-family: var(--fonte-corpo); min-height: 64px;
}
.botao-refugo-rapido:active { transform: scale(0.96); background: var(--aviso-bg-fraca); filter: brightness(1.3); }
.refugo-rapido-nome { font-size: 15px; color: var(--ink); text-align: left; font-weight: 600; }
.refugo-rapido-contagem { font-family: var(--fonte-display); font-weight: 800; font-size: 24px; color: var(--aviso); margin-left: 8px; }
.botao-outro-motivo { width: 100%; margin-top: 10px; background: var(--surface-2); border: 1px dashed var(--linha); color: var(--ink-muted); border-radius: var(--radius-sm); padding: 12px; font-family: var(--fonte-corpo); font-weight: 600; font-size: 14px; cursor: pointer; min-height: 48px; }

.lista-motivos { display: flex; flex-direction: column; gap: 8px; max-height: 50vh; overflow-y: auto; }
.linha-motivo { display: flex; justify-content: space-between; align-items: center; background: var(--surface-2); border: 1px solid var(--linha); border-radius: var(--radius-sm); padding: 14px 16px; cursor: pointer; font-size: 15px; min-height: 56px; }
.linha-motivo:active { transform: scale(0.98); filter: brightness(1.2); }

.stepper { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 24px 0; }
.stepper-botao { width: 64px; height: 64px; border-radius: 50%; border: 1.5px solid var(--linha); background: var(--surface-2); color: var(--ink); font-family: var(--fonte-display); font-size: 30px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; min-height: auto; }
.stepper-botao:active { transform: scale(0.92); background: var(--aviso-bg-fraca); }
.stepper-numero { font-family: var(--fonte-display); font-weight: 800; font-size: 52px; min-width: 90px; text-align: center; color: var(--aviso); }

.modal-fundo { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
.modal-cartao { background: var(--surface); border: 1px solid var(--linha); border-radius: var(--radius-lg); padding: 28px; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; box-shadow: var(--sombra); }

.etiqueta { text-align: center; padding: 16px 6px; background: #fff; color: #16171A; border-radius: var(--radius-md); }
.etiqueta-marca { font-family: var(--fonte-display); font-weight: 800; letter-spacing: 0.08em; font-size: 15px; color: #6B7280; }
.etiqueta-produto { font-family: var(--fonte-display); font-weight: 800; font-size: 23px; margin-top: 6px; }
.etiqueta-codigo { color: #6B7280; font-size: 14px; margin-bottom: 12px; }
.etiqueta-quantidade { font-family: var(--fonte-display); font-weight: 800; font-size: 58px; color: #16A34A; line-height: 1; }
.etiqueta-quantidade span { font-size: 16px; font-weight: 600; color: #6B7280; margin-left: 6px; }
.etiqueta-grade { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; margin-top: 20px; padding-top: 16px; border-top: 1px dashed #D1D5DB; font-size: 13px; }
.etiqueta-grade span { display: block; color: #6B7280; font-size: 11px; }

.spinner { width: 42px; height: 42px; border: 4px solid var(--linha); border-top-color: var(--accent); border-radius: 50%; margin: 0 auto 16px; animation: girar 0.8s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }
.erro-cartao { text-align: center; border-top: 6px solid var(--alerta); }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--surface-2); border: 1px solid var(--linha); color: var(--ink); padding: 13px 22px; border-radius: 999px; font-size: 14px; max-width: 90%; text-align: center; box-shadow: var(--sombra); z-index: 200; }

.passo-indicador { font-family: var(--fonte-display); font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }

@media (prefers-reduced-motion: reduce) {
  .spinner { animation: none; }
  button, .botao, .botao-refugo-rapido, .linha-motivo, .stepper-botao { transition: none; }
}

@media (max-width: 480px) {
  .cabecalho { flex-wrap: wrap; padding: 14px 16px; }
  .conteudo { padding: 14px; }
  .cartao, .modal-cartao { padding: 22px; }
  .cronometro { font-size: 52px; }
  .grade-info, .desempenho-bloco { grid-template-columns: 1fr; }
  .grade-refugo-rapido { grid-template-columns: 1fr; }
  .linha-botoes { flex-direction: column; }
}

@media print {
  body * { visibility: hidden; }
  #etiqueta-imprimir, #etiqueta-imprimir * { visibility: visible; }
  #etiqueta-imprimir { position: fixed; top: 0; left: 0; width: 100%; margin: 0; }
  .modal-fundo, .modal-cartao { position: static !important; background: none !important; box-shadow: none !important; padding: 0 !important; max-height: none !important; overflow: visible !important; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ============================================================
// OEE Vitalbor — Apontamento do Operador
// Camada de dados separada da UI: toda função que fala com o
// Supabase fica aqui em cima; a UI só chama e renderiza o
// resultado. Facilita ajustar consulta sem mexer em tela.
// ============================================================

// ---------- Configuração ----------
// Não existe mais MAQUINA_CODIGO fixo — a máquina agora é escolhida
// na tela (passo 1 do assistente), então o MESMO arquivo serve pra
// qualquer tablet, sem editar nada por aparelho.
const SUPABASE_URL = 'https://wjukjrzkqerqdtceawyt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqdWtqcnprcWVycWR0Y2Vhd3l0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNzM0MDIsImV4cCI6MjEwMTk0OTQwMn0.dtelewESHMy27Hz31kQlyWWn9OgWKKoZV78f1VzvbEw';

let sb = null;
let erroConfig = null;
try {
  if (SUPABASE_URL.indexOf('COLOQUE_') === 0 || SUPABASE_ANON_KEY.indexOf('COLOQUE_') === 0) {
    throw new Error('Preencha SUPABASE_URL e SUPABASE_ANON_KEY no topo do arquivo antes de usar.');
  }
  const { createClient } = supabase;
  sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch (e) {
  erroConfig = e.message;
}

const CHAVE_MAQUINA_LEMBRADA = 'vitalbor_maquina_id';
const PASSOS_INICIAR = ['maquina', 'turno', 'operador', 'op'];

function lembrarMaquina(id) {
  try { localStorage.setItem(CHAVE_MAQUINA_LEMBRADA, String(id)); } catch (e) { /* ambiente pode bloquear localStorage; segue sem lembrar */ }
}
function lerMaquinaLembrada() {
  try { return localStorage.getItem(CHAVE_MAQUINA_LEMBRADA); } catch (e) { return null; }
}

// ---------- Estado em memória ----------
let ctx = {
  carregando: true,
  erro: null,
  erroToast: null,
  maquina: null,
  cadastros: null,
  apontamento: null,
  parada: null,
  refugoTally: {},
  frequenciaHistorica: {},
  caixas: [],
  ultimoFechamentoCaixa: null,
  ultimaCaixaFechada: null,
  tela: 'ocioso',           // 'ocioso' | 'iniciando' | 'andamento'
  wizard: null,
  modal: null,               // null | 'parada' | 'caixa' | 'etiqueta' | 'cavidade' | 'confirmar-finalizar' | 'finalizar'
  form: {},
  erroForm: null,
  salvando: false,
  timerId: null,
  toastTimeoutId: null,
};

// ============================================================
// Acesso a dados (Supabase)
// ============================================================

async function carregarCadastros() {
  const [maquinas, operadores, produtos, moldes, materiais, turnos, motivosParada, tiposRefugo, ordensProducao] = await Promise.all([
    sb.from('maquinas').select('*').eq('ativo', true).order('codigo'),
    sb.from('operadores').select('*').eq('ativo', true).order('nome'),
    sb.from('produtos').select('*').order('nome'),
    sb.from('moldes').select('*').eq('ativo', true).order('nome'),
    sb.from('materiais').select('*').order('nome'),
    sb.from('turnos').select('*').order('hora_inicio'),
    sb.from('motivos_parada').select('*').eq('ativo', true).order('nome'),
    sb.from('tipos_refugo').select('*').eq('ativo', true).order('nome'),
    sb.from('ordens_producao').select('*').in('status', ['planejada', 'em_andamento']).order('numero'),
  ]);
  const resultados = { maquinas, operadores, produtos, moldes, materiais, turnos, motivosParada, tiposRefugo, ordensProducao };
  for (const chave in resultados) {
    if (resultados[chave].error) throw new Error(erroSupabaseParaMensagem(resultados[chave].error, 'Erro ao carregar cadastros (' + chave + ')'));
  }
  return {
    maquinas: maquinas.data, operadores: operadores.data, produtos: produtos.data, moldes: moldes.data,
    materiais: materiais.data, turnos: turnos.data, motivosParada: motivosParada.data,
    tiposRefugo: tiposRefugo.data, ordensProducao: ordensProducao.data,
  };
}

async function buscarApontamentoAberto(maquinaId) {
  const { data, error } = await sb.from('apontamentos').select('*').eq('maquina_id', maquinaId).is('fim', null).maybeSingle();
  if (error) throw new Error(erroSupabaseParaMensagem(error, 'Erro ao verificar apontamento em aberto'));
  return data;
}

async function buscarParadaAberta(apontamentoId) {
  const { data, error } = await sb.from('paradas').select('*').eq('apontamento_id', apontamentoId).is('fim', null).maybeSingle();
  if (error) throw new Error(erroSupabaseParaMensagem(error, 'Erro ao verificar parada em aberto'));
  return data;
}

async function carregarProgressoApontamento(apontamentoId) {
  const [refugosRes, caixasRes] = await Promise.all([
    sb.from('refugos').select('tipo_id, quantidade').eq('apontamento_id', apontamentoId),
    sb.from('caixas').select('*').eq('apontamento_id', apontamentoId).order('fechada_em', { ascending: false }),
  ]);
  if (refugosRes.error) throw new Error(erroSupabaseParaMensagem(refugosRes.error, 'Erro ao carregar refugo do apontamento'));
  if (caixasRes.error) throw new Error(erroSupabaseParaMensagem(caixasRes.error, 'Erro ao carregar caixas do apontamento'));
  const tally = {};
  (refugosRes.data || []).forEach(function (r) { tally[r.tipo_id] = (tally[r.tipo_id] || 0) + r.quantidade; });
  const caixas = caixasRes.data || [];
  return { refugoTally: tally, caixas: caixas, ultimoFechamentoCaixa: caixas.length ? caixas[0].fechada_em : null };
}

async function iniciarApontamento(payload) {
  const { data, error } = await sb.from('apontamentos').insert(payload).select().single();
  if (error) throw new Error(erroSupabaseParaMensagem(error, 'Erro ao iniciar apontamento'));
  return data;
}

async function iniciarParada(payload) {
  const { data, error } = await sb.from('paradas').insert(payload).select().single();
  if (error) throw new Error(erroSupabaseParaMensagem(error, 'Erro ao registrar parada'));
  return data;
}

async function finalizarParadaDB(paradaId) {
  const { data, error } = await sb.from('paradas').update({ fim: new Date().toISOString() }).eq('id', paradaId).select().single();
  if (error) throw new Error(erroSupabaseParaMensagem(error, 'Erro ao finalizar parada'));
  return data;
}

async function carregarFrequenciaRefugo() {
  // Conta ocorrências por tipo nos últimos registros — teto de 3000
  // linhas é folga generosa pro volume atual; se crescer muito, isso
  // deveria virar uma view agregada no banco em vez de somar no cliente.
  const { data, error } = await sb.from('refugos').select('tipo_id').order('registrado_em', { ascending: false }).limit(3000);
  if (error) throw new Error(erroSupabaseParaMensagem(error, 'Erro ao calcular frequência de refugo'));
  const contagem = {};
  (data || []).forEach(function (r) { contagem[r.tipo_id] = (contagem[r.tipo_id] || 0) + 1; });
  return contagem;
}

async function registrarRefugoDB(apontamentoId, tipoId, quantidade) {
  const { error } = await sb.from('refugos').insert({ apontamento_id: apontamentoId, tipo_id: tipoId, quantidade: quantidade });
  if (error) throw new Error(erroSupabaseParaMensagem(error, 'Erro ao registrar refugo'));
}

async function buscarRefugoDesde(apontamentoId, desde) {
  const { data, error } = await sb.from('refugos').select('quantidade').eq('apontamento_id', apontamentoId).gt('registrado_em', desde);
  if (error) throw new Error(erroSupabaseParaMensagem(error, 'Erro ao calcular refugo da caixa'));
  return (data || []).reduce(function (acc, r) { return acc + r.quantidade; }, 0);
}

async function fecharCaixaDB(payload) {
  const { data, error } = await sb.from('caixas').insert(payload).select().single();
  if (error) throw new Error(erroSupabaseParaMensagem(error, 'Erro ao fechar caixa'));
  return data;
}

async function atualizarCavidadesDB(apontamentoId, novoValor) {
  const { error } = await sb.from('apontamentos').update({ numero_cavidades_ativas: novoValor }).eq('id', apontamentoId);
  if (error) throw new Error(erroSupabaseParaMensagem(error, 'Erro ao atualizar cavidades'));
}

async function chamarResponsavelDB(apontamentoId, maquinaId) {
  const { error } = await sb.from('chamados_responsavel').insert({ apontamento_id: apontamentoId, maquina_id: maquinaId });
  if (error) throw new Error(erroSupabaseParaMensagem(error, 'Erro ao chamar responsável'));
}

async function finalizarApontamentoDB(apontamentoId, payload) {
  const { error } = await sb.from('apontamentos').update(payload).eq('id', apontamentoId);
  if (error) throw new Error(erroSupabaseParaMensagem(error, 'Erro ao finalizar apontamento'));
}

// ============================================================
// Utilidades

function fmtDuracao(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const hh = String(Math.floor(s / 3600)).padStart(2, '0');
  const mm = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
  const ss = String(s % 60).padStart(2, '0');
  return hh + ':' + mm + ':' + ss;
}

function fmtHora(iso) {
  return new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function porId(lista, id) {
  return (lista || []).find(function (x) { return x.id === Number(id); }) || null;
}

function erroSupabaseParaMensagem(error, contexto) {
  if (error && error.message && error.message.indexOf('Failed to fetch') !== -1) {
    return 'Não deu pra conectar no Supabase (' + contexto + '). Confira: SUPABASE_URL precisa ser a "Project URL" (formato https://xxxxxxxx.supabase.co) e se o aparelho tem internet.';
  }
  if (error && error.code === 'PGRST116') {
    return contexto + ': registro não encontrado.';
  }
  return contexto + ': ' + (error && error.message ? error.message : 'erro desconhecido');
}

function mostrarToast(msg) {
  ctx.erroToast = msg;
  render();
  if (ctx.toastTimeoutId) clearTimeout(ctx.toastTimeoutId);
  ctx.toastTimeoutId = setTimeout(function () { ctx.erroToast = null; render(); }, 4500);
}

// Peças boas (bruto - refugo) — usado na etiqueta e no total final.
function somaPecasCaixas() {
  return ctx.caixas.reduce(function (acc, c) { return acc + c.quantidade_pecas; }, 0);
}
// Peças brutas (sem descontar refugo) — usado no saldo da OP e no
// desempenho, por pedido explícito: refugo não desconta dessa conta.
function somaBrutaCaixas() {
  return ctx.caixas.reduce(function (acc, c) { return acc + c.quantidade_bruta; }, 0);
}

// Calcula quando o turno atual termina (trata turno que vira a noite,
// tipo 22:00–06:00, sem isso o cálculo de "quanto falta" quebra).
function calcularFimTurno(turno, agora) {
  const [hIni, mIni] = turno.hora_inicio.slice(0, 5).split(':').map(Number);
  const [hFim, mFim] = turno.hora_fim.slice(0, 5).split(':').map(Number);
  const inicioMin = hIni * 60 + mIni, fimMin = hFim * 60 + mFim;
  const fim = new Date(agora);
  fim.setHours(hFim, mFim, 0, 0);
  if (fimMin <= inicioMin) {
    const agoraMin = agora.getHours() * 60 + agora.getMinutes();
    if (agoraMin >= inicioMin) fim.setDate(fim.getDate() + 1);
  }
  return fim;
}

async function init() {
  if (erroConfig) {
    ctx.carregando = false;
    ctx.erro = erroConfig;
    render();
    return;
  }
  try {
    ctx.cadastros = await carregarCadastros();
    const maquinaLembradaId = lerMaquinaLembrada();
    const maquinaLembrada = maquinaLembradaId ? porId(ctx.cadastros.maquinas, Number(maquinaLembradaId)) : null;
    if (maquinaLembrada) {
      ctx.maquina = maquinaLembrada;
      ctx.apontamento = await buscarApontamentoAberto(maquinaLembrada.id);
      if (ctx.apontamento) {
        ctx.parada = await buscarParadaAberta(ctx.apontamento.id);
        const progresso = await carregarProgressoApontamento(ctx.apontamento.id);
        ctx.refugoTally = progresso.refugoTally;
        ctx.caixas = progresso.caixas;
        ctx.ultimoFechamentoCaixa = progresso.ultimoFechamentoCaixa;
        ctx.frequenciaHistorica = await carregarFrequenciaRefugo();
        ctx.tela = 'andamento';
      } else {
        ctx.tela = 'ocioso';
      }
    } else {
      ctx.tela = 'ocioso';
    }
    ctx.carregando = false;
    iniciarRelogio();
  } catch (e) {
    ctx.carregando = false;
    ctx.erro = e.message;
  }
  render();
}

function abrirIniciar() {
  ctx.wizard = {
    passo: 'maquina',
    maquina_id: ctx.maquina ? String(ctx.maquina.id) : (lerMaquinaLembrada() || ''),
    turno_id: turnoSugeridoAgora(),
    operador_id: '',
    ordem_producao_id: '',
    produto_id: '', molde_id: '', material_id: '', numero_cavidades_ativas: '', lote_material: '', _lotePrefixoAuto: '',
  };
  ctx.erroForm = null;
  ctx.tela = 'iniciando';
  render();
}

function turnoSugeridoAgora() {
  const agora = new Date();
  const hhmm = String(agora.getHours()).padStart(2, '0') + ':' + String(agora.getMinutes()).padStart(2, '0');
  const turnos = (ctx.cadastros && ctx.cadastros.turnos) || [];
  for (const t of turnos) {
    const ini = t.hora_inicio.slice(0, 5);
    const fim = t.hora_fim.slice(0, 5);
    if (ini < fim ? (hhmm >= ini && hhmm < fim) : (hhmm >= ini || hhmm < fim)) return String(t.id);
  }
  return '';
}

async function avancarPasso() {
  const w = ctx.wizard;

  if (w.passo === 'maquina') {
    if (!w.maquina_id) { ctx.erroForm = 'Selecione a máquina.'; render(); return; }
    ctx.erroForm = null;
    ctx.salvando = true;
    render();
    let aberto;
    try {
      aberto = await buscarApontamentoAberto(Number(w.maquina_id));
    } catch (e) {
      ctx.salvando = false;
      ctx.erroForm = e.message;
      render();
      return;
    }
    ctx.salvando = false;
    if (aberto) { await retomarApontamentoExistente(Number(w.maquina_id), aberto); return; }
  } else if (w.passo === 'turno') {
    if (!w.turno_id) { ctx.erroForm = 'Selecione o turno.'; render(); return; }
  } else if (w.passo === 'operador') {
    if (!w.operador_id) { ctx.erroForm = 'Selecione o operador.'; render(); return; }
  }

  ctx.erroForm = null;
  const idx = PASSOS_INICIAR.indexOf(w.passo);
  if (idx < PASSOS_INICIAR.length - 1) { w.passo = PASSOS_INICIAR[idx + 1]; render(); }
}

async function retomarApontamentoExistente(maquinaId, apontamentoAberto) {
  const maquina = porId(ctx.cadastros.maquinas, maquinaId);
  ctx.maquina = maquina;
  if (maquina) lembrarMaquina(maquina.id);
  ctx.apontamento = apontamentoAberto;
  try {
    ctx.parada = await buscarParadaAberta(apontamentoAberto.id);
    const progresso = await carregarProgressoApontamento(apontamentoAberto.id);
    ctx.refugoTally = progresso.refugoTally;
    ctx.caixas = progresso.caixas;
    ctx.ultimoFechamentoCaixa = progresso.ultimoFechamentoCaixa;
    ctx.frequenciaHistorica = await carregarFrequenciaRefugo();
  } catch (e) {
    ctx.erro = e.message;
    render();
    return;
  }
  ctx.wizard = null;
  ctx.tela = 'andamento';
  render();
  mostrarToast('Essa máquina já tinha um apontamento em aberto — retomando.');
}

function voltarPasso() {
  ctx.erroForm = null;
  const idx = PASSOS_INICIAR.indexOf(ctx.wizard.passo);
  if (idx <= 0) { ctx.tela = 'ocioso'; render(); return; }
  ctx.wizard.passo = PASSOS_INICIAR[idx - 1];
  render();
}

function aplicarPrefixoLote(w, materialId) {
  const material = porId(ctx.cadastros.materiais, materialId);
  const prefixo = material ? (material.tipo || material.codigo) + '-' : '';
  w.lote_material = prefixo;
  w._lotePrefixoAuto = prefixo;
}

function aoMudarWizOp(valor) {
  const w = ctx.wizard;
  w.ordem_producao_id = valor;
  if (valor === '999' || !valor) {
    w.produto_id = ''; w.molde_id = ''; w.material_id = ''; w.numero_cavidades_ativas = '';
    w.lote_material = ''; w._lotePrefixoAuto = '';
  } else {
    const op = porId(ctx.cadastros.ordensProducao, valor);
    if (op) {
      w.produto_id = op.produto_id ? String(op.produto_id) : '';
      w.molde_id = op.molde_id ? String(op.molde_id) : '';
      w.material_id = op.material_id ? String(op.material_id) : '';
      const molde = op.molde_id ? porId(ctx.cadastros.moldes, op.molde_id) : null;
      w.numero_cavidades_ativas = molde ? String(molde.numero_cavidades) : '';
      if (op.material_id) aplicarPrefixoLote(w, op.material_id); else { w.lote_material = ''; w._lotePrefixoAuto = ''; }
    }
  }
  render();
}

function aoMudarWizProduto(valor) {
  ctx.wizard.produto_id = valor;
  ctx.wizard.molde_id = '';
  ctx.wizard.numero_cavidades_ativas = '';
  render();
}

function aoMudarWizMolde(valor) {
  ctx.wizard.molde_id = valor;
  const molde = porId(ctx.cadastros.moldes, valor);
  ctx.wizard.numero_cavidades_ativas = molde ? String(molde.numero_cavidades) : '';
  render();
}

function aoMudarWizMaterial(valor) {
  const w = ctx.wizard;
  w.material_id = valor;
  if (!w.lote_material || w.lote_material === w._lotePrefixoAuto) {
    aplicarPrefixoLote(w, valor);
  } else {
    const material = porId(ctx.cadastros.materiais, valor);
    w._lotePrefixoAuto = material ? (material.tipo || material.codigo) + '-' : '';
  }
  render();
}

async function confirmarIniciarWizard() {
  const w = ctx.wizard;
  if (!w.ordem_producao_id) { ctx.erroForm = 'Selecione a Ordem de Produção (ou 999 pra sem OP).'; render(); return; }
  const obrigatorios = ['maquina_id', 'turno_id', 'operador_id', 'produto_id', 'molde_id', 'numero_cavidades_ativas', 'material_id', 'lote_material'];
  const faltando = obrigatorios.some(function (k) { return !w[k]; });
  if (faltando) { ctx.erroForm = 'Preencha todos os campos antes de iniciar.'; render(); return; }

  const molde = porId(ctx.cadastros.moldes, w.molde_id);
  if (molde && Number(w.numero_cavidades_ativas) > molde.numero_cavidades) {
    ctx.erroForm = 'Número de cavidades não pode passar de ' + molde.numero_cavidades + ' (cadastro do molde).';
    render();
    return;
  }

  ctx.erroForm = null;
  ctx.salvando = true;
  render();
  try {
    const maquina = porId(ctx.cadastros.maquinas, w.maquina_id);
    const payload = {
      maquina_id: Number(w.maquina_id),
      operador_id: Number(w.operador_id),
      produto_id: Number(w.produto_id),
      molde_id: Number(w.molde_id),
      material_id: Number(w.material_id),
      turno_id: Number(w.turno_id),
      ordem_producao_id: w.ordem_producao_id === '999' ? null : Number(w.ordem_producao_id),
      numero_cavidades_ativas: Number(w.numero_cavidades_ativas),
      lote_material: w.lote_material,
    };
    ctx.apontamento = await iniciarApontamento(payload);
    ctx.maquina = maquina;
    if (maquina) lembrarMaquina(maquina.id);
    ctx.parada = null;
    ctx.refugoTally = {};
    ctx.caixas = [];
    ctx.ultimoFechamentoCaixa = null;
    ctx.frequenciaHistorica = await carregarFrequenciaRefugo();
    ctx.tela = 'andamento';
  } catch (e) {
    ctx.erroForm = e.message;
  }
  ctx.salvando = false;
  render();
}

async function confirmarCavidade() {
  const molde = porId(ctx.cadastros.moldes, ctx.apontamento.molde_id);
  const novo = Number(ctx.form.numero_cavidades_ativas);
  if (!ctx.form.numero_cavidades_ativas || !Number.isInteger(novo) || novo <= 0) {
    ctx.erroForm = 'Informe um número de cavidades válido.'; render(); return;
  }
  if (molde && novo > molde.numero_cavidades) {
    ctx.erroForm = 'Não pode passar de ' + molde.numero_cavidades + ' (cadastro do molde).'; render(); return;
  }
  ctx.erroForm = null;
  ctx.salvando = true;
  render();
  try {
    await atualizarCavidadesDB(ctx.apontamento.id, novo);
    ctx.apontamento.numero_cavidades_ativas = novo;
    ctx.modal = null;
  } catch (e) {
    ctx.erroForm = e.message;
  }
  ctx.salvando = false;
  render();
}

}

async function calcularCaixa() {
  const injecoes = Number(ctx.form.numero_injecoes);
  if (!ctx.form.numero_injecoes || !Number.isInteger(injecoes) || injecoes <= 0) {
    ctx.erroForm = 'Informe quantas injetadas essa caixa levou (número inteiro maior que zero).';
    render();
    return;
  }
  ctx.erroForm = null;
  ctx.salvando = true;
  render();
  try {
    const desde = ctx.ultimoFechamentoCaixa || ctx.apontamento.inicio;
    const refugoDaCaixa = await buscarRefugoDesde(ctx.apontamento.id, desde);
    const cavAtual = ctx.apontamento.numero_cavidades_ativas;
    const brutas = injecoes * cavAtual;
    if (refugoDaCaixa > brutas) {
      ctx.erroForm = 'O refugo registrado desde a última caixa (' + refugoDaCaixa + ') é maior que o total dessa leva (' + brutas + ' = ' + injecoes + ' injetadas × ' + cavAtual + ' cavidades). Confere antes de fechar.';
      ctx.salvando = false;
      render();
      return;
    }
    ctx.form.numero_injecoes = injecoes;
    ctx.form.cavidades_no_fechamento = cavAtual;
    ctx.form.refugo_contabilizado = refugoDaCaixa;
    ctx.form.quantidade_bruta = brutas;
    ctx.form.quantidade_pecas = brutas - refugoDaCaixa;
    ctx.form.fase = 'revisao';
  } catch (e) {
    ctx.erroForm = e.message;
  }
  ctx.salvando = false;
  render();
}

async function confirmarCaixa() {

    const caixa = await fecharCaixaDB({

      cavidades_no_fechamento: ctx.form.cavidades_no_fechamento,
      refugo_contabilizado: ctx.form.refugo_contabilizado,
      quantidade_bruta: ctx.form.quantidade_bruta,
      quantidade_pecas: ctx.form.quantidade_pecas,
    });
    ctx.caixas = [caixa].concat(ctx.caixas);
    ctx.ultimoFechamentoCaixa = caixa.fechada_em;
    ctx.ultimaCaixaFechada = caixa;
    ctx.modal = 'etiqueta';

    ctx.erroForm = e.message;
  }
  ctx.salvando = false;
  render();
}

async function confirmarFinalizar() {
  const f = ctx.form;
  ctx.erroForm = null;
  ctx.salvando = true;
  render();
  try {
    const payload = {
      fim: new Date().toISOString(),
      quantidade_produzida: somaPecasCaixas(),
      peso_total_usado_kg: f.peso_total_usado_kg === '' ? null : Number(f.peso_total_usado_kg),
      peso_sobra_kg: f.peso_sobra_kg === '' ? null : Number(f.peso_sobra_kg),
    };
    await finalizarApontamentoDB(ctx.apontamento.id, payload);
    ctx.apontamento = null;
    ctx.parada = null;
    ctx.modal = null;
    ctx.caixas = [];
    ctx.refugoTally = {};
    ctx.tela = 'ocioso';
  } catch (e) {
    ctx.erroForm = e.message;
  }
  ctx.salvando = false;
  render();
}

function iniciarRelogio() {
  if (ctx.timerId) clearInterval(ctx.timerId);
  ctx.timerId = setInterval(function () { atualizarRelogioDOM(); }, 1000);
}

function atualizarRelogioDOM() {
  const relogioEl = document.getElementById('relogio');
  if (relogioEl) relogioEl.textContent = new Date().toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'medium' });
  const cronoEl = document.getElementById('cronometro');
  if (cronoEl && ctx.apontamento) {
    const base = ctx.parada ? ctx.parada.inicio : ctx.apontamento.inicio;
    cronoEl.textContent = fmtDuracao(Date.now() - new Date(base).getTime());
  }
}

function render() {
  const app = document.getElementById('app');
  if (!app) return;

  if (ctx.carregando) { app.innerHTML = viewCarregando(); return; }
  if (ctx.erro) { app.innerHTML = viewErro(); return; }

  let html = viewCabecalho();
  if (ctx.tela === 'ocioso') html += viewOcioso();
  else if (ctx.tela === 'iniciando') html += viewIniciando();
  else if (ctx.tela === 'andamento') html += viewAndamento();

  if (ctx.modal === 'parada') html += viewModalParada();
  if (ctx.modal === 'cavidade') html += viewModalCavidade();
  if (ctx.modal === 'caixa') html += viewModalCaixa();
  if (ctx.modal === 'refugo-quantidade') html += viewModalRefugoQuantidade();
  if (ctx.modal === 'outro-motivo') html += viewModalOutroMotivo();
  if (ctx.modal === 'etiqueta') html += viewEtiqueta();
  if (ctx.modal === 'confirmar-finalizar') html += viewModalConfirmarFinalizar();
  if (ctx.modal === 'finalizar') html += viewModalFinalizar();

  if (ctx.erroToast) html += '<div class="toast">' + esc(ctx.erroToast) + '</div>';

function viewBarraProgresso() {
  if (!ctx.apontamento.ordem_producao_id) return '';
  const op = porId(ctx.cadastros.ordensProducao, ctx.apontamento.ordem_producao_id);
  if (!op) return '';
  const produzido = somaPecasCaixas();
  const meta = op.quantidade_planejada;
  const pct = meta > 0 ? Math.min(100, Math.round((produzido / meta) * 100)) : 0;
  return '<div class="progresso-bloco">' +
    '<div class="progresso-legenda"><span>Saldo da OP ' + esc(op.numero) + '</span><span>' + produzido + ' / ' + meta + '</span></div>' +
    '<div class="barra-fundo"><div class="barra-preenchida" style="width:' + pct + '%"></div></div>' +
    '</div>';
}

function viewDesempenho() {
  const a = ctx.apontamento;
  const horasDecorridas = (Date.now() - new Date(a.inicio).getTime()) / 3600000;
  // Menos de ~6 min de produção dá conta instável (poucos dados,
  // extrapola pra números absurdos) — melhor não mostrar do que
  // mostrar algo enganoso.
  if (horasDecorridas < 0.1) return '<p class="muted-pequeno">Ritmo: calculando (aguardando mais alguns minutos de produção)…</p>';

  const injecoesTotal = ctx.caixas.reduce(function (acc, c) { return acc + c.numero_injecoes; }, 0);
  const ritmoAtual = injecoesTotal / horasDecorridas;

  if (!a.ordem_producao_id) {
    return '<p class="muted-pequeno">Seu ritmo: <strong>' + Math.round(ritmoAtual) + ' inj/h</strong></p>';
  }
  const op = porId(ctx.cadastros.ordensProducao, a.ordem_producao_id);
  const turno = porId(ctx.cadastros.turnos, a.turno_id);
  if (!op || !turno) return '';

  const restante = Math.max(0, op.quantidade_planejada - somaPecasCaixas());
  const horasRestantes = (calcularFimTurno(turno, new Date()).getTime() - Date.now()) / 3600000;
  const necessario = (horasRestantes > 0.02 && a.numero_cavidades_ativas > 0) ? (restante / horasRestantes) / a.numero_cavidades_ativas : 0;
  const noRitmo = ritmoAtual >= necessario;

  return '<div class="desempenho-bloco ' + (noRitmo ? 'desempenho-ok' : 'desempenho-atras') + '">' +
    '<span class="desempenho-selo">' + (noRitmo ? '✓ No ritmo' : '⚠ Abaixo do ritmo') + '</span>' +
    '<span class="desempenho-numeros">' + Math.round(ritmoAtual) + ' inj/h · meta ' + Math.round(necessario) + ' inj/h</span>' +
    '</div>';
}

function viewGradeRefugoRapido() {
  const tipos = ctx.cadastros.tiposRefugo;
  if (!tipos.length) return '';
  const ordenados = tipos.slice().sort(function (a, b) {
    return (ctx.frequenciaHistorica[b.id] || 0) - (ctx.frequenciaHistorica[a.id] || 0);
  });
  const frequentes = ordenados.slice(0, 4);
  const idsFrequentes = frequentes.map(function (t) { return t.id; });
  const temMais = tipos.length > frequentes.length;

  return '<div class="refugo-rapido-bloco"><span class="rotulo-info">Apontar refugo</span><div class="grade-refugo-rapido">' +
    frequentes.map(function (t) {
      const n = ctx.refugoTally[t.id] || 0;
      return '<button class="botao-refugo-rapido" data-acao="refugo-tocar" data-tipo-refugo="' + t.id + '">' +
        '<span class="refugo-rapido-nome">' + esc(t.nome) + '</span><span class="refugo-rapido-contagem">' + n + '</span></button>';
    }).join('') + '</div>' +
    (temMais ? '<button class="botao-outro-motivo" data-acao="abrir-outro-motivo">+ Outro motivo</button>' : '') +
    '</div>';
}

    '<h2>Já fechou a última caixa?</h2>' +
    '<p class="muted-pequeno">Total já calculado: <strong>' + somaPecasCaixas() + ' peças boas</strong> em ' + ctx.caixas.length + ' caixa(s). Se ainda tem produção fora de caixa, feche ela antes.</p>' +
    '<div class="linha-botoes"><button class="botao botao-secundario" data-acao="ainda-falta-caixa">Ainda falta fechar</button>' +
    '<button class="botao botao-primario" data-acao="ja-fechei-tudo">Já fechei tudo</button></div>' +
    '</div></div>';
}

function viewModalFinalizar() {
  const f = ctx.form;

  if (f.fase === 'revisao') {
    return '<div class="modal-fundo" data-acao="fechar-modal-fundo"><div class="modal-cartao" data-parar-propagacao="1">' +
      '<h2>Confirmar Finalização</h2>' +
      (ctx.erroForm ? '<div class="alerta-banner">' + esc(ctx.erroForm) + '</div>' : '') +
      '<div class="revisao-numero">' + somaPecasCaixas() + '<span> peças boas</span></div>' +
      '<p class="muted-pequeno">' + ctx.caixas.length + ' caixa(s) · Material usado: ' + (f.peso_total_usado_kg || '—') + ' kg · Sobra: ' + (f.peso_sobra_kg || '—') + ' kg</p>' +
      '<p class="muted-pequeno">Isso encerra o apontamento — não dá pra reabrir depois.</p>' +
      '<div class="linha-botoes"><button class="botao botao-secundario" data-acao="voltar-finalizar-entrada">Voltar</button>' +
      '<button class="botao botao-primario"' + (ctx.salvando ? ' disabled' : '') + ' data-acao="confirmar-finalizar">' + (ctx.salvando ? 'Salvando…' : 'Confirmar e Finalizar') + '</button></div>' +
      '</div></div>';
  }

  return '<div class="modal-fundo" data-acao="fechar-modal-fundo"><div class="modal-cartao" data-parar-propagacao="1">' +
    '<h2>Finalizar Produção</h2>' +
    (ctx.erroForm ? '<div class="alerta-banner">' + esc(ctx.erroForm) + '</div>' : '') +
    '<label>Peso total de matéria-prima usado (kg)</label>' +
    '<input type="number" inputmode="decimal" step="0.001" min="0" data-campo="peso_total_usado_kg" value="' + esc(f.peso_total_usado_kg) + '">' +
    '<label>Sobra (kg, opcional)</label>' +
    '<input type="number" inputmode="decimal" step="0.001" min="0" data-campo="peso_sobra_kg" value="' + esc(f.peso_sobra_kg) + '">' +
    '<div class="linha-botoes"><button class="botao botao-secundario" data-acao="fechar-modal">Cancelar</button>' +
    '<button class="botao botao-primario" data-acao="revisar-finalizar">Revisar</button></div>' +
    '</div></div>';
}

// ============================================================
// Eventos
// ============================================================

function ligarEventos() {
  document.querySelectorAll('[data-campo]').forEach(function (elCampo) {
    const evento = elCampo.tagName === 'SELECT' ? 'change' : 'input';
    elCampo.addEventListener(evento, function () { ctx.form[elCampo.getAttribute('data-campo')] = elCampo.value; });
  });

  document.querySelectorAll('[data-wiz]').forEach(function (elCampo) {
    const evento = elCampo.tagName === 'SELECT' ? 'change' : 'input';
    elCampo.addEventListener(evento, function () {
      const campo = elCampo.getAttribute('data-wiz');
      if (campo === 'ordem_producao_id') return aoMudarWizOp(elCampo.value);
      if (campo === 'produto_id') return aoMudarWizProduto(elCampo.value);
      if (campo === 'molde_id') return aoMudarWizMolde(elCampo.value);
      if (campo === 'material_id') return aoMudarWizMaterial(elCampo.value);
      ctx.wizard[campo] = elCampo.value;
    });
  });

  document.querySelectorAll('[data-acao]').forEach(function (elBotao) {
    elBotao.addEventListener('click', function (ev) {
      const acao = elBotao.getAttribute('data-acao');
      if (acao === 'fechar-modal-fundo' && ev.target !== elBotao) return;
      if (acao === 'refugo-tocar') return abrirRefugoQuantidade(Number(elBotao.getAttribute('data-tipo-refugo')));
      if (acao === 'outro-motivo-item') { ctx.modal = null; return selecionarOutroMotivo(Number(elBotao.getAttribute('data-tipo-refugo'))); }
      if (acao === 'refugo-qtd-mais') return incrementarQtdRefugo();
      if (acao === 'refugo-qtd-menos') return decrementarQtdRefugo();
      if (acao === 'imprimir-etiqueta') { window.print(); return; }
      if (acao === 'ainda-falta-caixa') { ctx.modal = null; abrirModalCaixa(); return; }
      if (acao === 'ja-fechei-tudo') { ctx.modal = null; abrirModalFinalizar(); return; }
      const mapa = {
        'abrir-iniciar': abrirIniciar,
        'avancar-passo': avancarPasso,
        'voltar-passo': voltarPasso,
        'confirmar-iniciar-wizard': confirmarIniciarWizard,
        'abrir-parada': abrirModalParada,
        'confirmar-parada': confirmarParada,
        'finalizar-parada': confirmarFimParada,
        'abrir-cavidade': abrirModalCavidade,
        'confirmar-cavidade': confirmarCavidade,
        'abrir-caixa': abrirModalCaixa,
        'calcular-caixa': calcularCaixa,
        'voltar-caixa-entrada': voltarCaixaEntrada,
        'confirmar-caixa': confirmarCaixa,
        'abrir-outro-motivo': abrirOutroMotivo,
        'confirmar-refugo-quantidade': confirmarRefugoQuantidade,
        'chamar-responsavel': chamarResponsavel,
        'abrir-confirmar-finalizar': abrirConfirmarFinalizar,
        'revisar-finalizar': revisarFinalizar,
        'voltar-finalizar-entrada': voltarFinalizarEntrada,
        'confirmar-finalizar': confirmarFinalizar,
        'fechar-modal': fecharModal,
        'fechar-modal-fundo': fecharModal,
        'recarregar': function () { ctx.erro = null; ctx.carregando = true; render(); init(); },
      };
      if (mapa[acao]) mapa[acao]();
    });
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
