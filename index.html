<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Apontamento — Vitalbor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #F3F5F4;
  --surface: #FFFFFF;
  --ink: #16232A;
  --ink-muted: #5C6B6E;
  --linha: #DCE3E1;
  --accent: #1F6F5C;
  --accent-forte: #17564A;
  --accent-ink: #FFFFFF;
  --accent-bg-fraca: #E7F3EF;
  --alerta: #B3261E;
  --alerta-forte: #8F1E18;
  --alerta-bg-fraca: #FBEAE9;
  --neutro-bg-fraca: #EDEFEE;
  --radius-lg: 22px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --sombra: 0 10px 30px rgba(22, 35, 42, 0.08);
  --fonte-display: 'Barlow Semi Condensed', system-ui, sans-serif;
  --fonte-corpo: 'Inter', system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--fonte-corpo);
  -webkit-tap-highlight-color: transparent;
}

#app { min-height: 100vh; display: flex; flex-direction: column; }

.cabecalho {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 18px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--linha);
}

.marca { font-family: var(--fonte-display); font-weight: 700; font-size: 22px; letter-spacing: 0.01em; }
.marca-sub { font-weight: 500; color: var(--ink-muted); font-size: 15px; margin-left: 6px; }

.maquina-chip {
  font-family: var(--fonte-display);
  font-weight: 600;
  font-size: 16px;
  background: var(--neutro-bg-fraca);
  padding: 6px 16px;
  border-radius: 999px;
}

.relogio { font-variant-numeric: tabular-nums; color: var(--ink-muted); font-size: 14px; }

.conteudo { flex: 1; padding: 24px; display: flex; }
.tela-central { flex: 1; display: flex; align-items: center; justify-content: center; }

.cartao {
  background: var(--surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--sombra);
  padding: 32px;
  width: 100%;
  max-width: 480px;
}

.cartao-ocioso { text-align: center; }
.cartao-ocioso h1 { font-family: var(--fonte-display); font-size: 40px; margin: 12px 0 4px; }

.status-pill {
  display: inline-block;
  font-family: var(--fonte-display);
  font-weight: 600;
  font-size: 14px;
  padding: 6px 16px;
  border-radius: 999px;
  letter-spacing: 0.02em;
}
.status-ocioso { background: var(--neutro-bg-fraca); color: var(--ink-muted); }
.status-rodando { background: var(--accent-bg-fraca); color: var(--accent-forte); }
.status-parado { background: var(--alerta-bg-fraca); color: var(--alerta-forte); }

h2 { font-family: var(--fonte-display); font-size: 24px; margin: 0 0 20px; }

.muted { color: var(--ink-muted); }
.muted-pequeno { color: var(--ink-muted); font-size: 13px; margin: 6px 0 16px; }

label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-muted); margin: 16px 0 6px; }
label:first-of-type { margin-top: 0; }

select, input[type="text"], input[type="number"], textarea {
  width: 100%;
  font-family: var(--fonte-corpo);
  font-size: 17px;
  padding: 13px 14px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--linha);
  background: var(--surface);
  color: var(--ink);
}
select:focus-visible, input:focus-visible, textarea:focus-visible, button:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 1px;
}
select:disabled { background: var(--neutro-bg-fraca); color: var(--ink-muted); }
textarea { resize: vertical; }

.botao {
  font-family: var(--fonte-display);
  font-weight: 600;
  font-size: 17px;
  letter-spacing: 0.01em;
  border: none;
  border-radius: var(--radius-sm);
  padding: 15px 20px;
  cursor: pointer;
  min-height: 56px;
}
.botao:disabled { opacity: 0.6; cursor: not-allowed; }
.botao-primario { background: var(--accent); color: var(--accent-ink); }
.botao-primario:active:not(:disabled) { background: var(--accent-forte); }
.botao-secundario { background: var(--neutro-bg-fraca); color: var(--ink); }
.botao-alerta { background: var(--alerta); color: #fff; }
.botao-alerta:active:not(:disabled) { background: var(--alerta-forte); }
.botao-grande { width: 100%; font-size: 19px; padding: 18px 20px; }

.linha-botoes { display: flex; gap: 12px; margin-top: 24px; }
.linha-botoes .botao { flex: 1; }

.alerta-banner {
  background: var(--alerta-bg-fraca);
  color: var(--alerta-forte);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-size: 14px;
  margin-bottom: 16px;
}

.cartao-andamento { text-align: center; border-top: 6px solid var(--accent); }
.cartao-andamento.cartao-parado { border-top-color: var(--alerta); }

.cronometro {
  font-family: var(--fonte-display);
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  font-size: 64px;
  letter-spacing: 0.02em;
  margin: 12px 0;
}
.cartao-rodando .cronometro { color: var(--accent); }
.cartao-parado .cronometro { color: var(--alerta); }

.motivo-parada { color: var(--alerta-forte); font-weight: 600; margin: -4px 0 12px; }

.grade-info {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  text-align: left;
  margin: 24px 0 4px;
  padding-top: 20px;
  border-top: 1px solid var(--linha);
}
.rotulo-info { display: block; font-size: 12px; color: var(--ink-muted); margin-bottom: 2px; }

.modal-fundo {
  position: fixed; inset: 0;
  background: rgba(22, 35, 42, 0.5);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  z-index: 100;
}
.modal-cartao {
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 28px;
  width: 100%;
  max-width: 440px;
  max-height: 90vh;
  overflow-y: auto;
}

.grade-refugo { display: flex; flex-direction: column; gap: 10px; }
.linha-refugo { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.linha-refugo span { flex: 1; font-size: 15px; }
.linha-refugo input { width: 100px; }

.spinner {
  width: 40px; height: 40px;
  border: 4px solid var(--linha);
  border-top-color: var(--accent);
  border-radius: 50%;
  margin: 0 auto 16px;
  animation: girar 0.8s linear infinite;
}
@keyframes girar { to { transform: rotate(360deg); } }

.erro-cartao { text-align: center; border-top: 6px solid var(--alerta); }

@media (prefers-reduced-motion: reduce) {
  .spinner { animation: none; }
}

@media (max-width: 480px) {
  .cabecalho { flex-wrap: wrap; padding: 14px 16px; }
  .conteudo { padding: 14px; }
  .cartao, .modal-cartao { padding: 22px; }
  .cronometro { font-size: 48px; }
  .grade-info { grid-template-columns: 1fr; }
  .linha-botoes { flex-direction: column; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ============================================================
// OEE Vitalbor — Apontamento do Operador
// Camada de dados separada da UI: toda função que fala com o
// Supabase fica aqui em cima; a UI só chama e renderiza o
// resultado. Facilita ajustar consulta sem mexer em tela.
// ============================================================

// ---------- Configuração (preencher antes de usar) ----------
const SUPABASE_URL = 'https://supabase.com/dashboard/project/wjukjrzkqerqdtceawyt';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqdWtqcnprcWVycWR0Y2Vhd3l0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNzM0MDIsImV4cCI6MjEwMTk0OTQwMn0.dtelewESHMy27Hz31kQlyWWn9OgWKKoZV78f1VzvbEw';
const MAQUINA_CODIGO = 'INJ-01'; // qual máquina este tablet representa

let sb = null;
let erroConfig = null;
try {
  if (SUPABASE_URL.indexOf('COLOQUE_') === 0 || SUPABASE_ANON_KEY.indexOf('COLOQUE_') === 0) {
    throw new Error('Preencha SUPABASE_URL e SUPABASE_ANON_KEY no topo do arquivo antes de usar.');
  }
  const { createClient } = supabase;
  sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch (e) {
  erroConfig = e.message;
}

// ---------- Estado em memória ----------
let ctx = {
  carregando: true,
  erro: null,
  maquina: null,
  cadastros: null,
  apontamento: null,   // apontamento aberto (fim = null) ou null
  parada: null,        // parada aberta (fim = null) ou null
  tela: 'ocioso',       // 'ocioso' | 'iniciando' | 'andamento'
  modal: null,          // null | 'parada' | 'finalizar'
  form: {},             // valores temporários de formulário/modal
  salvando: false,
  timerId: null,
};

// ============================================================
// Acesso a dados (Supabase)
// ============================================================

async function carregarMaquina() {
  const { data, error } = await sb.from('maquinas').select('*').eq('codigo', MAQUINA_CODIGO).single();
  if (error) {
    if (error.code === 'PGRST116') {
      throw new Error('Máquina "' + MAQUINA_CODIGO + '" não encontrada no cadastro. Rodou o schema.sql nesse projeto? O código bate certinho, com as mesmas maiúsculas?');
    }
    throw new Error(erroSupabaseParaMensagem(error, 'Erro ao buscar a máquina "' + MAQUINA_CODIGO + '"'));
  }
  return data;
}

async function carregarCadastros() {
  const [operadores, produtos, moldes, materiais, turnos, motivosParada, tiposRefugo, ordensProducao] = await Promise.all([
    sb.from('operadores').select('*').eq('ativo', true).order('nome'),
    sb.from('produtos').select('*').order('nome'),
    sb.from('moldes').select('*').eq('ativo', true).order('nome'),
    sb.from('materiais').select('*').order('nome'),
    sb.from('turnos').select('*').order('hora_inicio'),
    sb.from('motivos_parada').select('*').eq('ativo', true).order('nome'),
    sb.from('tipos_refugo').select('*').eq('ativo', true).order('nome'),
    sb.from('ordens_producao').select('*').in('status', ['planejada', 'em_andamento']).order('numero'),
  ]);
  const resultados = { operadores, produtos, moldes, materiais, turnos, motivosParada, tiposRefugo, ordensProducao };
  for (const chave in resultados) {
    if (resultados[chave].error) throw new Error(erroSupabaseParaMensagem(resultados[chave].error, 'Erro ao carregar cadastros (' + chave + ')'));
  }
  return {
    operadores: operadores.data, produtos: produtos.data, moldes: moldes.data,
    materiais: materiais.data, turnos: turnos.data, motivosParada: motivosParada.data,
    tiposRefugo: tiposRefugo.data, ordensProducao: ordensProducao.data,
  };
}

async function buscarApontamentoAberto(maquinaId) {
  const { data, error } = await sb.from('apontamentos').select('*').eq('maquina_id', maquinaId).is('fim', null).maybeSingle();
  if (error) throw new Error(erroSupabaseParaMensagem(error, 'Erro ao verificar apontamento em aberto'));
  return data;
}

async function buscarParadaAberta(apontamentoId) {
  const { data, error } = await sb.from('paradas').select('*').eq('apontamento_id', apontamentoId).is('fim', null).maybeSingle();
  if (error) throw new Error(erroSupabaseParaMensagem(error, 'Erro ao verificar parada em aberto'));
  return data;
}

async function iniciarApontamento(payload) {
  const { data, error } = await sb.from('apontamentos').insert(payload).select().single();
  if (error) throw new Error(erroSupabaseParaMensagem(error, 'Erro ao iniciar apontamento'));
  return data;
}

async function iniciarParada(payload) {
  const { data, error } = await sb.from('paradas').insert(payload).select().single();
  if (error) throw new Error(erroSupabaseParaMensagem(error, 'Erro ao registrar parada'));
  return data;
}

async function finalizarParadaDB(paradaId) {
  const { data, error } = await sb.from('paradas').update({ fim: new Date().toISOString() }).eq('id', paradaId).select().single();
  if (error) throw new Error(erroSupabaseParaMensagem(error, 'Erro ao finalizar parada'));
  return data;
}

async function finalizarApontamentoDB(apontamentoId, payload, refugos) {
  const { error: errApont } = await sb.from('apontamentos').update(payload).eq('id', apontamentoId);
  if (errApont) throw new Error(erroSupabaseParaMensagem(errApont, 'Erro ao finalizar apontamento'));
  const linhas = refugos.filter(function (r) { return r.quantidade > 0; })
    .map(function (r) { return { apontamento_id: apontamentoId, tipo_id: r.tipo_id, quantidade: r.quantidade }; });
  if (linhas.length > 0) {
    const { error: errRefugo } = await sb.from('refugos').insert(linhas);
    if (errRefugo) throw new Error(erroSupabaseParaMensagem(errRefugo, 'Apontamento fechado, mas erro ao salvar refugo'));
  }
}

// ============================================================
// Utilidades
// ============================================================

function fmtDuracao(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const hh = String(Math.floor(s / 3600)).padStart(2, '0');
  const mm = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
  const ss = String(s % 60).padStart(2, '0');
  return hh + ':' + mm + ':' + ss;
}

function fmtHora(iso) {
  return new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function porId(lista, id) {
  return (lista || []).find(function (x) { return x.id === id; }) || null;
}

// "Failed to fetch" é a requisição nem saindo do navegador (URL errada,
// sem internet, CORS) — bem diferente de um erro que o Supabase respondeu
// de fato. Separar os dois evita mensagem enganosa tipo "não encontrada"
// quando na real é problema de conexão/config.
function erroSupabaseParaMensagem(error, contexto) {
  if (error && error.message && error.message.indexOf('Failed to fetch') !== -1) {
    return 'Não deu pra conectar no Supabase (' + contexto + '). Confira: SUPABASE_URL precisa ser a "Project URL" (formato https://xxxxxxxx.supabase.co) — não a connection string do Postgres nem a Reference ID sozinha — e se o aparelho tem internet.';
  }
  if (error && error.code === 'PGRST116') {
    return contexto + ': registro não encontrado.';
  }
  return contexto + ': ' + (error && error.message ? error.message : 'erro desconhecido');
}

// ============================================================
// Ações (ligam UI a dados)
// ============================================================

async function init() {
  if (erroConfig) {
    ctx.carregando = false;
    ctx.erro = erroConfig;
    render();
    return;
  }
  try {
    ctx.maquina = await carregarMaquina();
    ctx.cadastros = await carregarCadastros();
    ctx.apontamento = await buscarApontamentoAberto(ctx.maquina.id);
    if (ctx.apontamento) {
      ctx.parada = await buscarParadaAberta(ctx.apontamento.id);
      ctx.tela = 'andamento';
    } else {
      ctx.tela = 'ocioso';
    }
    ctx.carregando = false;
    iniciarRelogio();
  } catch (e) {
    ctx.carregando = false;
    ctx.erro = e.message;
  }
  render();
}

function abrirIniciar() {
  ctx.form = { operador_id: '', turno_id: turnoSugeridoAgora(), ordem_producao_id: '', produto_id: '', molde_id: '', numero_cavidades_ativas: '', material_id: '', lote_material: '' };
  ctx.tela = 'iniciando';
  render();
}

function turnoSugeridoAgora() {
  const agora = new Date();
  const hhmm = String(agora.getHours()).padStart(2, '0') + ':' + String(agora.getMinutes()).padStart(2, '0');
  const turnos = (ctx.cadastros && ctx.cadastros.turnos) || [];
  for (const t of turnos) {
    const ini = t.hora_inicio.slice(0, 5);
    const fim = t.hora_fim.slice(0, 5);
    if (ini < fim ? (hhmm >= ini && hhmm < fim) : (hhmm >= ini || hhmm < fim)) return t.id;
  }
  return '';
}

function cancelarIniciar() {
  ctx.tela = 'ocioso';
  render();
}

function aoMudarProdutoForm(produtoId) {
  ctx.form.produto_id = produtoId;
  ctx.form.molde_id = '';
  ctx.form.numero_cavidades_ativas = '';
  render();
}

function aoMudarOrdemForm(opId) {
  ctx.form.ordem_producao_id = opId;
  if (opId) {
    const op = porId(ctx.cadastros.ordensProducao, Number(opId));
    if (op) aoMudarProdutoForm(String(op.produto_id));
  }
  render();
}

function aoMudarMoldeForm(moldeId) {
  ctx.form.molde_id = moldeId;
  const molde = porId(ctx.cadastros.moldes, Number(moldeId));
  ctx.form.numero_cavidades_ativas = molde ? String(molde.numero_cavidades) : '';
  render();
}

async function confirmarIniciar() {
  const f = ctx.form;
  const obrigatorios = ['operador_id', 'turno_id', 'produto_id', 'molde_id', 'numero_cavidades_ativas', 'material_id', 'lote_material'];
  const faltando = obrigatorios.some(function (k) { return !f[k]; });
  if (faltando) { ctx.erroForm = 'Preencha todos os campos antes de iniciar.'; render(); return; }

  const molde = porId(ctx.cadastros.moldes, Number(f.molde_id));
  if (molde && Number(f.numero_cavidades_ativas) > molde.numero_cavidades) {
    ctx.erroForm = 'Número de cavidades não pode passar de ' + molde.numero_cavidades + ' (cadastro do molde).';
    render();
    return;
  }

  ctx.erroForm = null;
  ctx.salvando = true;
  render();
  try {
    const payload = {
      maquina_id: ctx.maquina.id,
      operador_id: Number(f.operador_id),
      produto_id: Number(f.produto_id),
      molde_id: Number(f.molde_id),
      material_id: Number(f.material_id),
      turno_id: Number(f.turno_id),
      ordem_producao_id: f.ordem_producao_id ? Number(f.ordem_producao_id) : null,
      numero_cavidades_ativas: Number(f.numero_cavidades_ativas),
      lote_material: f.lote_material,
    };
    ctx.apontamento = await iniciarApontamento(payload);
    ctx.parada = null;
    ctx.tela = 'andamento';
  } catch (e) {
    ctx.erroForm = e.message;
  }
  ctx.salvando = false;
  render();
}

function abrirModalParada() {
  ctx.form = { motivo_id: '', observacao: '' };
  ctx.erroForm = null;
  ctx.modal = 'parada';
  render();
}

function fecharModal() {
  ctx.modal = null;
  ctx.erroForm = null;
  render();
}

async function confirmarParada() {
  if (!ctx.form.motivo_id) { ctx.erroForm = 'Selecione o motivo da parada.'; render(); return; }
  ctx.salvando = true;
  render();
  try {
    ctx.parada = await iniciarParada({
      apontamento_id: ctx.apontamento.id,
      maquina_id: ctx.maquina.id,
      motivo_id: Number(ctx.form.motivo_id),
      observacao: ctx.form.observacao || null,
    });
    ctx.modal = null;
  } catch (e) {
    ctx.erroForm = e.message;
  }
  ctx.salvando = false;
  render();
}

async function confirmarFimParada() {
  ctx.salvando = true;
  render();
  try {
    await finalizarParadaDB(ctx.parada.id);
    ctx.parada = null;
  } catch (e) {
    ctx.erro = e.message;
  }
  ctx.salvando = false;
  render();
}

function abrirModalFinalizar() {
  const tipos = ctx.cadastros.tiposRefugo;
  const refugoPorTipo = {};
  tipos.forEach(function (t) { refugoPorTipo[t.id] = '0'; });
  ctx.form = { quantidade_produzida: '', refugoPorTipo: refugoPorTipo, peso_total_usado_kg: '', peso_sobra_kg: '' };
  ctx.erroForm = null;
  ctx.modal = 'finalizar';
  render();
}

function somaRefugoForm() {
  return Object.values(ctx.form.refugoPorTipo || {}).reduce(function (acc, v) { return acc + (Number(v) || 0); }, 0);
}

async function confirmarFinalizar() {
  const f = ctx.form;
  if (f.quantidade_produzida === '' || Number(f.quantidade_produzida) < 0) {
    ctx.erroForm = 'Informe a quantidade produzida.'; render(); return;
  }
  const totalRefugo = somaRefugoForm();
  if (totalRefugo > Number(f.quantidade_produzida)) {
    ctx.erroForm = 'A soma do refugo (' + totalRefugo + ') não pode passar da quantidade produzida (' + f.quantidade_produzida + ').';
    render();
    return;
  }
  ctx.salvando = true;
  render();
  try {
    const payload = {
      fim: new Date().toISOString(),
      quantidade_produzida: Number(f.quantidade_produzida),
      peso_total_usado_kg: f.peso_total_usado_kg === '' ? null : Number(f.peso_total_usado_kg),
      peso_sobra_kg: f.peso_sobra_kg === '' ? null : Number(f.peso_sobra_kg),
    };
    const refugos = Object.keys(f.refugoPorTipo).map(function (tipoId) {
      return { tipo_id: Number(tipoId), quantidade: Number(f.refugoPorTipo[tipoId]) || 0 };
    });
    await finalizarApontamentoDB(ctx.apontamento.id, payload, refugos);
    ctx.apontamento = null;
    ctx.parada = null;
    ctx.modal = null;
    ctx.tela = 'ocioso';
  } catch (e) {
    ctx.erroForm = e.message;
  }
  ctx.salvando = false;
  render();
}

function iniciarRelogio() {
  if (ctx.timerId) clearInterval(ctx.timerId);
  ctx.timerId = setInterval(function () {
    atualizarRelogioDOM();
  }, 1000);
}

function atualizarRelogioDOM() {
  const relogioEl = document.getElementById('relogio');
  if (relogioEl) relogioEl.textContent = new Date().toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'medium' });
  const cronoEl = document.getElementById('cronometro');
  if (cronoEl && ctx.apontamento) {
    const base = ctx.parada ? ctx.parada.inicio : ctx.apontamento.inicio;
    cronoEl.textContent = fmtDuracao(Date.now() - new Date(base).getTime());
  }
}

// ============================================================
// Render
// ============================================================

function render() {
  const app = document.getElementById('app');
  if (!app) return;

  if (ctx.carregando) { app.innerHTML = viewCarregando(); return; }
  if (ctx.erro) { app.innerHTML = viewErro(); return; }

  let html = viewCabecalho();
  if (ctx.tela === 'ocioso') html += viewOcioso();
  else if (ctx.tela === 'iniciando') html += viewIniciando();
  else if (ctx.tela === 'andamento') html += viewAndamento();

  if (ctx.modal === 'parada') html += viewModalParada();
  if (ctx.modal === 'finalizar') html += viewModalFinalizar();

  app.innerHTML = html;
  atualizarRelogioDOM();
  ligarEventos();
}

function viewCarregando() {
  return '<div class="tela-central"><div class="spinner"></div><p class="muted">Carregando dados da máquina…</p></div>';
}

function viewErro() {
  return '<div class="tela-central"><div class="cartao erro-cartao">' +
    '<h2>Não deu pra carregar</h2><p>' + esc(ctx.erro) + '</p>' +
    '<button class="botao botao-primario" data-acao="recarregar">Tentar de novo</button>' +
    '</div></div>';
}

function viewCabecalho() {
  return '<header class="cabecalho">' +
    '<div class="marca">Vitalbor <span class="marca-sub">Apontamento</span></div>' +
    '<div class="maquina-chip">' + esc(ctx.maquina.codigo) + (ctx.maquina.nome ? ' · ' + esc(ctx.maquina.nome) : '') + '</div>' +
    '<div id="relogio" class="relogio"></div>' +
    '</header>';
}

function viewOcioso() {
  return '<main class="conteudo tela-central">' +
    '<div class="cartao cartao-ocioso">' +
    '<div class="status-pill status-ocioso">Sem apontamento em aberto</div>' +
    '<h1>' + esc(ctx.maquina.codigo) + '</h1>' +
    '<p class="muted">Inicie um novo apontamento para começar a registrar produção.</p>' +
    '<button class="botao botao-primario botao-grande" data-acao="abrir-iniciar">Iniciar Produção</button>' +
    '</div></main>';
}

function opcoes(lista, valorSelecionado, rotulo) {
  let html = '<option value="">Selecione…</option>';
  (lista || []).forEach(function (item) {
    const sel = String(valorSelecionado) === String(item.id) ? ' selected' : '';
    html += '<option value="' + item.id + '"' + sel + '>' + esc(rotulo(item)) + '</option>';
  });
  return html;
}

function viewIniciando() {
  const f = ctx.form;
  const c = ctx.cadastros;
  const moldesFiltrados = f.produto_id ? c.moldes.filter(function (m) { return String(m.produto_id) === String(f.produto_id); }) : c.moldes;
  const opSelecionada = f.ordem_producao_id;

  return '<main class="conteudo">' +
    '<div class="cartao">' +
    '<h2>Iniciar Produção</h2>' +
    (ctx.erroForm ? '<div class="alerta-banner">' + esc(ctx.erroForm) + '</div>' : '') +

    '<label>Operador</label>' +
    '<select data-campo="operador_id">' + opcoes(c.operadores, f.operador_id, function (o) { return o.nome; }) + '</select>' +

    '<label>Turno</label>' +
    '<select data-campo="turno_id">' + opcoes(c.turnos, f.turno_id, function (t) { return t.nome; }) + '</select>' +

    '<label>Ordem de Produção (opcional)</label>' +
    '<select data-campo="ordem_producao_id">' +
    '<option value="">Sem OP</option>' +
    (c.ordensProducao || []).map(function (op) {
      const sel = String(opSelecionada) === String(op.id) ? ' selected' : '';
      return '<option value="' + op.id + '"' + sel + '>' + esc(op.numero) + '</option>';
    }).join('') +
    '</select>' +

    '<label>Produto</label>' +
    '<select data-campo="produto_id"' + (f.ordem_producao_id ? ' disabled' : '') + '>' + opcoes(c.produtos, f.produto_id, function (p) { return p.codigo + ' — ' + p.nome; }) + '</select>' +

    '<label>Molde</label>' +
    '<select data-campo="molde_id">' + opcoes(moldesFiltrados, f.molde_id, function (m) { return m.codigo + (m.nome ? ' — ' + m.nome : ''); }) + '</select>' +

    '<label>Número de cavidades ativas</label>' +
    '<input type="number" inputmode="numeric" min="1" data-campo="numero_cavidades_ativas" value="' + esc(f.numero_cavidades_ativas) + '">' +

    '<label>Material</label>' +
    '<select data-campo="material_id">' + opcoes(c.materiais, f.material_id, function (m) { return m.codigo + ' — ' + m.nome; }) + '</select>' +

    '<label>Lote do material</label>' +
    '<input type="text" data-campo="lote_material" value="' + esc(f.lote_material) + '" placeholder="Ex: L2026-0731">' +

    '<div class="linha-botoes">' +
    '<button class="botao botao-secundario" data-acao="cancelar-iniciar">Cancelar</button>' +
    '<button class="botao botao-primario"' + (ctx.salvando ? ' disabled' : '') + ' data-acao="confirmar-iniciar">' + (ctx.salvando ? 'Iniciando…' : 'Iniciar') + '</button>' +
    '</div>' +
    '</div></main>';
}

function viewAndamento() {
  const c = ctx.cadastros;
  const a = ctx.apontamento;
  const produto = porId(c.produtos, a.produto_id);
  const molde = porId(c.moldes, a.molde_id);
  const operador = porId(c.operadores, a.operador_id);
  const material = porId(c.materiais, a.material_id);
  const parado = !!ctx.parada;
  const motivoAtual = parado ? porId(c.motivosParada, ctx.parada.motivo_id) : null;

  return '<main class="conteudo tela-central">' +
    '<div class="cartao cartao-andamento ' + (parado ? 'cartao-parado' : 'cartao-rodando') + '">' +
    '<div class="status-pill ' + (parado ? 'status-parado' : 'status-rodando') + '">' + (parado ? 'Parada em andamento' : 'Produzindo') + '</div>' +
    '<div id="cronometro" class="cronometro"></div>' +
    (parado ? '<p class="motivo-parada">Motivo: ' + esc(motivoAtual ? motivoAtual.nome : '—') + '</p>' : '') +

    '<div class="grade-info">' +
    '<div><span class="rotulo-info">Produto</span>' + esc(produto ? produto.codigo : '—') + '</div>' +
    '<div><span class="rotulo-info">Molde</span>' + esc(molde ? molde.codigo : '—') + '</div>' +
    '<div><span class="rotulo-info">Operador</span>' + esc(operador ? operador.nome : '—') + '</div>' +
    '<div><span class="rotulo-info">Material</span>' + esc(material ? material.codigo : '—') + '</div>' +
    '<div><span class="rotulo-info">Lote</span>' + esc(a.lote_material) + '</div>' +
    '<div><span class="rotulo-info">Início</span>' + fmtHora(a.inicio) + '</div>' +
    '</div>' +

    '<div class="linha-botoes">' +
    (parado
      ? '<button class="botao botao-primario botao-grande" data-acao="finalizar-parada">Finalizar Parada</button>'
      : '<button class="botao botao-alerta botao-grande" data-acao="abrir-parada">Registrar Parada</button>' +
        '<button class="botao botao-primario botao-grande" data-acao="abrir-finalizar">Finalizar Produção</button>') +
    '</div>' +
    '</div></main>';
}

function viewModalParada() {
  const f = ctx.form;
  return '<div class="modal-fundo" data-acao="fechar-modal-fundo">' +
    '<div class="modal-cartao" data-parar-propagacao="1">' +
    '<h2>Registrar Parada</h2>' +
    (ctx.erroForm ? '<div class="alerta-banner">' + esc(ctx.erroForm) + '</div>' : '') +
    '<label>Motivo</label>' +
    '<select data-campo="motivo_id">' + opcoes(ctx.cadastros.motivosParada, f.motivo_id, function (m) { return m.nome; }) + '</select>' +
    '<label>Observação (opcional)</label>' +
    '<textarea data-campo="observacao" rows="3">' + esc(f.observacao) + '</textarea>' +
    '<div class="linha-botoes">' +
    '<button class="botao botao-secundario" data-acao="fechar-modal">Cancelar</button>' +
    '<button class="botao botao-alerta"' + (ctx.salvando ? ' disabled' : '') + ' data-acao="confirmar-parada">' + (ctx.salvando ? 'Registrando…' : 'Confirmar Parada') + '</button>' +
    '</div></div></div>';
}

function viewModalFinalizar() {
  const f = ctx.form;
  const soma = somaRefugoForm();
  return '<div class="modal-fundo" data-acao="fechar-modal-fundo">' +
    '<div class="modal-cartao" data-parar-propagacao="1">' +
    '<h2>Finalizar Produção</h2>' +
    (ctx.erroForm ? '<div class="alerta-banner">' + esc(ctx.erroForm) + '</div>' : '') +

    '<label>Quantidade produzida (total)</label>' +
    '<input type="number" inputmode="numeric" min="0" data-campo="quantidade_produzida" value="' + esc(f.quantidade_produzida) + '">' +

    '<label>Refugo por tipo</label>' +
    '<div class="grade-refugo">' +
    ctx.cadastros.tiposRefugo.map(function (t) {
      return '<div class="linha-refugo"><span>' + esc(t.nome) + '</span>' +
        '<input type="number" inputmode="numeric" min="0" data-campo-refugo="' + t.id + '" value="' + esc(f.refugoPorTipo[t.id]) + '"></div>';
    }).join('') +
    '</div>' +
    '<p class="muted-pequeno">Soma do refugo: ' + soma + '</p>' +

    '<label>Peso total usado (kg, opcional)</label>' +
    '<input type="number" inputmode="decimal" step="0.001" min="0" data-campo="peso_total_usado_kg" value="' + esc(f.peso_total_usado_kg) + '">' +

    '<label>Sobra (kg, opcional)</label>' +
    '<input type="number" inputmode="decimal" step="0.001" min="0" data-campo="peso_sobra_kg" value="' + esc(f.peso_sobra_kg) + '">' +

    '<div class="linha-botoes">' +
    '<button class="botao botao-secundario" data-acao="fechar-modal">Cancelar</button>' +
    '<button class="botao botao-primario"' + (ctx.salvando ? ' disabled' : '') + ' data-acao="confirmar-finalizar">' + (ctx.salvando ? 'Salvando…' : 'Confirmar e Finalizar') + '</button>' +
    '</div></div></div>';
}

// ============================================================
// Eventos (delegação simples, sem framework)
// ============================================================

function ligarEventos() {
  document.querySelectorAll('[data-campo]').forEach(function (elCampo) {
    const evento = elCampo.tagName === 'SELECT' ? 'change' : 'input';
    elCampo.addEventListener(evento, function () {
      const campo = elCampo.getAttribute('data-campo');
      if (campo === 'produto_id') return aoMudarProdutoForm(elCampo.value);
      if (campo === 'ordem_producao_id') return aoMudarOrdemForm(elCampo.value);
      if (campo === 'molde_id') return aoMudarMoldeForm(elCampo.value);
      ctx.form[campo] = elCampo.value;
    });
  });

  document.querySelectorAll('[data-campo-refugo]').forEach(function (elCampo) {
    elCampo.addEventListener('input', function () {
      const tipoId = elCampo.getAttribute('data-campo-refugo');
      ctx.form.refugoPorTipo[tipoId] = elCampo.value;
      const somaEl = document.querySelector('.muted-pequeno');
      if (somaEl) somaEl.textContent = 'Soma do refugo: ' + somaRefugoForm();
    });
  });

  document.querySelectorAll('[data-acao]').forEach(function (elBotao) {
    elBotao.addEventListener('click', function (ev) {
      const acao = elBotao.getAttribute('data-acao');
      if (acao === 'fechar-modal-fundo' && ev.target !== elBotao) return; // clique dentro do cartão não fecha
      const mapa = {
        'abrir-iniciar': abrirIniciar,
        'cancelar-iniciar': cancelarIniciar,
        'confirmar-iniciar': confirmarIniciar,
        'abrir-parada': abrirModalParada,
        'confirmar-parada': confirmarParada,
        'finalizar-parada': confirmarFimParada,
        'abrir-finalizar': abrirModalFinalizar,
        'confirmar-finalizar': confirmarFinalizar,
        'fechar-modal': fecharModal,
        'fechar-modal-fundo': fecharModal,
        'recarregar': function () { ctx.erro = null; ctx.carregando = true; render(); init(); },
      };
      if (mapa[acao]) mapa[acao]();
    });
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
